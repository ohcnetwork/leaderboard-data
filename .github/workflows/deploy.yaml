name: Build & Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - production

concurrency:
  group: deploy-to-cf-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Deploy Web and DB
    runs-on: ubuntu-latest
    environment: production
    env:
      LEADERBOARD_PATH: ${{ github.workspace }}/leaderboard
      WORKSPACE_ROOT: ${{ github.workspace }}/leaderboard
      LEADERBOARD_DATA_DIR: ${{ github.workspace }}/data
      GITHUB_ORG: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
      SLACK_CHANNEL: ${{ vars.SLACK_EOD_CHANNEL }}

    steps:
      - name: 📥 Checkout Leaderboard
        uses: actions/checkout@v5
        with:
          repository: ohcnetwork/leaderboard
          path: ${{ env.LEADERBOARD_PATH }}
          fetch-depth: 1

      - name: 📥 Checkout Leaderboard Data
        uses: actions/checkout@v5
        with:
          path: ${{ env.LEADERBOARD_DATA_DIR }}
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            ${{ env.LEADERBOARD_PATH }}/pnpm-lock.yaml

      - name: 📦 Prepare
        working-directory: ${{ env.LEADERBOARD_PATH }}
        run: |
          pnpm install
          pnpm build:packages
          pnpm data:import

      - name: 🗃️ Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ env.LEADERBOARD_PATH }}/apps/leaderboard-web/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: 🛠️ Build Leaderboard
        working-directory: ${{ env.LEADERBOARD_PATH }}
        run: pnpm build:web

      - name: Prepare Leaderboard DB artifact
        run: |
          mkdir -p _site
          cp ${{ env.LEADERBOARD_DATA_DIR }}/.leaderboard.db _site/data.db

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

      - name: 🌐 Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.LEADERBOARD_PATH }}/apps/leaderboard-web/out/ --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-db:
    name: Deploy Leaderboard Database
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
