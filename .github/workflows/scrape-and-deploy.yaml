name: Scrape and Deploy

on:
  schedule:
    - cron: 0 */12 * * *
  workflow_dispatch:
    inputs:
      days:
        type: number
        description: "Number of days to scrape"
        default: 1

concurrency:
  group: scheduled-data-scraper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-data:
    name: Scrape data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEADERBOARD_PATH: ${{ github.workspace }}/leaderboard
      LEADERBOARD_DATA_DIR: ${{ github.workspace }}/data

      SCRAPE_DAYS: ${{ inputs.days || 1 }}

      GITHUB_ORG: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
      SLACK_CHANNEL: ${{ vars.SLACK_EOD_CHANNEL }}

    steps:
      - name: Authenticate as leaderboard-bot[bot]
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.LEADERBOARD_BOT_ID }}
          private-key: ${{ secrets.LEADERBOARD_BOT_PRIVATE_KEY }}

      - name: 📥 Checkout Leaderboard
        uses: actions/checkout@v5
        with:
          repository: ohcnetwork/leaderboard
          path: ${{ env.LEADERBOARD_PATH }}
          fetch-depth: 1

      - name: 📥 Checkout Leaderboard Data
        uses: actions/checkout@v5
        with:
          path: ${{ env.LEADERBOARD_DATA_DIR }}
          fetch-depth: 1
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            ${{ env.LEADERBOARD_PATH }}/pnpm-lock.yaml

      - name: 📦 Install Dependencies
        working-directory: ${{ env.LEADERBOARD_PATH }}
        run: pnpm install

      - name: 🔍 Scrape Data
        working-directory: ${{ env.LEADERBOARD_PATH }}
        run: pnpm build:data

      - name: Setup Git Identity
        run: |
          git config --global user.name "leaderboard-bot[bot]"
          git config --global user.email "${{ vars.LEADERBOARD_BOT_ID }}+leaderboard-bot[bot]@users.noreply.github.com"

      - name: 📤 Commit and Push Changes to Leaderboard Data
        run: |
          cd ${{ env.LEADERBOARD_DATA_DIR }}
          git add -A

          # commit only if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update leaderboard data"

          # Configure remote with app token for authentication
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git

          # Ensure pushing to the correct branch (default = main)
          git push origin HEAD:main

      - name: 📦 Upload SQLite Database Artifact
        uses: actions/upload-artifact@v4
        with:
          name: data.sqlite
          path: ${{ env.LEADERBOARD_DATA_DIR }}/.leaderboard.db
          retention-days: 30
