<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="65%" stop-color="#DAA520" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2206" />
      <stop offset="100%" stop-color="#1A1400" />
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8D0" />
      <stop offset="40%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#DAA520" />
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE880" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="ray">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#ring)" />
  <circle cx="64" cy="64" r="52" fill="url(#bg)" />
  <!-- Radiating lines from eye -->
  <g transform="translate(64,64)" filter="url(#ray)" opacity="0.2">
    <line x1="-34" y1="-18" x2="-42" y2="-24" stroke="#FFD700" stroke-width="1.2" />
    <line x1="34" y1="-18" x2="42" y2="-24" stroke="#FFD700" stroke-width="1.2" />
    <line x1="-36" y1="16" x2="-44" y2="22" stroke="#FFD700" stroke-width="1" />
    <line x1="36" y1="16" x2="44" y2="22" stroke="#FFD700" stroke-width="1" />
    <line x1="0" y1="-26" x2="0" y2="-36" stroke="#FFD700" stroke-width="1.4" />
  </g>
  <g filter="url(#glow)" transform="translate(64,64)">
    <!-- Eye outline -->
    <path d="M-30,0 C-16,-22 16,-22 30,0 C16,22 -16,22 -30,0 Z" fill="none" stroke="url(#icon)" stroke-width="3" stroke-linejoin="round" />
    <!-- Iris -->
    <circle cx="0" cy="0" r="12" fill="url(#iris)" opacity="0.85" />
    <!-- Pupil -->
    <circle cx="0" cy="0" r="6" fill="#1A1400" />
    <!-- Pupil highlight -->
    <circle cx="-2.5" cy="-3" r="3" fill="#FFF8D0" opacity="0.5" />
    <!-- Sparkles -->
    <circle cx="20" cy="-16" r="2" fill="#FFE880" opacity="0.9" />
    <circle cx="-18" cy="14" r="1.5" fill="#FFD700" opacity="0.7" />
    <circle cx="14" cy="14" r="1.2" fill="#FFF8D0" opacity="0.8" />
    <circle cx="-12" cy="-16" r="1" fill="#FFE066" opacity="0.6" />
  </g>
  <ellipse cx="48" cy="34" rx="22" ry="14" fill="white" opacity="0.07" />
</svg>