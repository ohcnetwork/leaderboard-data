<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F4FF" />
      <stop offset="30%" stop-color="#D4DCE8" />
      <stop offset="50%" stop-color="#B8C8E0" />
      <stop offset="100%" stop-color="#7A90B0" />
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1E2E" />
      <stop offset="100%" stop-color="#0C0E18" />
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E0E8F8" />
      <stop offset="60%" stop-color="#B8C8E0" />
      <stop offset="100%" stop-color="#8AA0C0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="particle">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#ring)" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="#F0F4FF" stroke-width="0.4" opacity="0.4" />
  <circle cx="64" cy="64" r="52" fill="url(#bg)" />
  <!-- Ambient particles -->
  <g filter="url(#particle)" opacity="0.45">
    <circle cx="40" cy="38" r="1" fill="#B8C8E0" />
    <circle cx="88" cy="42" r="0.8" fill="#D4DCE8" />
    <circle cx="78" cy="82" r="1.2" fill="#B8C8E0" />
    <circle cx="44" cy="86" r="0.7" fill="#D4DCE8" />
  </g>
  <g filter="url(#glow)" transform="translate(64,64)">
    <!-- Main vertical line -->
    <line x1="0" y1="-30" x2="0" y2="30" stroke="url(#icon)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Branch line -->
    <path d="M0,-30 C-22,-16 -22,2 0,10" fill="none" stroke="url(#icon)" stroke-width="3" stroke-linecap="round" />
    <!-- Electric arc on branch -->
    <path d="M-16,-18 Q-22,-14 -18,-10" fill="none" stroke="#E0E8F8" stroke-width="0.8" opacity="0.6" />
    <!-- Top circle -->
    <circle cx="0" cy="-30" r="6" fill="#0C0E18" stroke="url(#icon)" stroke-width="2.5" />
    <!-- Branch dot -->
    <circle cx="-22" cy="-6" r="5" fill="url(#icon)" />
    <!-- Bottom circle -->
    <circle cx="0" cy="30" r="6" fill="#0C0E18" stroke="url(#icon)" stroke-width="2.5" />
    <path d="M-3,28 L0,33 L3,28" fill="none" stroke="url(#icon)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bright sparks -->
    <circle cx="16" cy="-24" r="2.5" fill="#F0F4FF" opacity="0.9" />
    <circle cx="-16" cy="16" r="2" fill="#E0E8F8" opacity="0.8" />
    <circle cx="12" cy="14" r="1.5" fill="#FFFFFF" opacity="0.7" />
    <circle cx="-10" cy="-26" r="1.8" fill="#D4DCE8" opacity="0.6" />
    <circle cx="20" cy="0" r="1" fill="#FFFFFF" opacity="0.9" />
  </g>
  <ellipse cx="50" cy="34" rx="24" ry="14" fill="white" opacity="0.06" />
</svg>