<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4945A" />
      <stop offset="45%" stop-color="#CD7F32" />
      <stop offset="100%" stop-color="#8B5E3C" />
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D2B1F" />
      <stop offset="100%" stop-color="#1A0F07" />
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C080" />
      <stop offset="100%" stop-color="#CD7F32" />
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A96A" />
      <stop offset="100%" stop-color="#8B5E3C" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#ring)" />
  <circle cx="64" cy="64" r="52" fill="url(#bg)" />
  <!-- Eye icon -->
  <g filter="url(#glow)" transform="translate(64,64)">
    <!-- Eye outline -->
    <path d="M-28,0 C-14,-18 14,-18 28,0 C14,18 -14,18 -28,0 Z" fill="none" stroke="url(#icon)" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Iris -->
    <circle cx="0" cy="0" r="10" fill="url(#iris)" opacity="0.8" />
    <!-- Pupil -->
    <circle cx="0" cy="0" r="5" fill="#1A0F07" />
    <!-- Pupil highlight -->
    <circle cx="-2" cy="-2" r="2" fill="#F0C080" opacity="0.5" />
  </g>
  <ellipse cx="48" cy="36" rx="20" ry="12" fill="white" opacity="0.06" />
</svg>