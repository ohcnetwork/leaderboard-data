<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E8E8" />
      <stop offset="40%" stop-color="#C0C0C0" />
      <stop offset="100%" stop-color="#808080" />
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2A3A" />
      <stop offset="100%" stop-color="#12121C" />
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F0F0" />
      <stop offset="50%" stop-color="#C0C0C0" />
      <stop offset="100%" stop-color="#909090" />
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8D8E0" />
      <stop offset="100%" stop-color="#8888A0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#ring)" />
  <circle cx="64" cy="64" r="52" fill="url(#bg)" />
  <g filter="url(#glow)" transform="translate(64,64)">
    <!-- Eye outline -->
    <path d="M-30,0 C-16,-20 16,-20 30,0 C16,20 -16,20 -30,0 Z" fill="none" stroke="url(#icon)" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Iris -->
    <circle cx="0" cy="0" r="11" fill="url(#iris)" opacity="0.8" />
    <!-- Pupil -->
    <circle cx="0" cy="0" r="5.5" fill="#12121C" />
    <!-- Pupil highlight -->
    <circle cx="-2" cy="-2.5" r="2.5" fill="#E0E0E0" opacity="0.5" />
    <!-- Sparkle accents -->
    <circle cx="18" cy="-14" r="1.5" fill="#E8E8E8" opacity="0.7" />
    <circle cx="-16" cy="12" r="1" fill="#D0D0D0" opacity="0.5" />
  </g>
  <ellipse cx="48" cy="36" rx="22" ry="14" fill="white" opacity="0.08" />
</svg>