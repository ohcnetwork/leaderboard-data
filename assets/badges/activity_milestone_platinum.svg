<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
        <linearGradient id="plat-ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#F0F4FF" />
            <stop offset="30%" stop-color="#D4DCE8" />
            <stop offset="50%" stop-color="#B8C8E0" />
            <stop offset="75%" stop-color="#9CB0D0" />
            <stop offset="100%" stop-color="#7A90B0" />
        </linearGradient>
        <linearGradient id="plat-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1A1E2E" />
            <stop offset="100%" stop-color="#0C0E18" />
        </linearGradient>
        <linearGradient id="plat-bolt" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="30%" stop-color="#E0E8F8" />
            <stop offset="60%" stop-color="#B8C8E0" />
            <stop offset="100%" stop-color="#8AA0C0" />
        </linearGradient>
        <filter id="glow-p">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="particle-glow">
            <feGaussianBlur stdDeviation="1.5" />
        </filter>
    </defs>
    <!-- Outer ring with double border -->
    <circle cx="64" cy="64" r="60" fill="url(#plat-ring)" />
    <circle cx="64" cy="64" r="58" fill="none" stroke="#F0F4FF" stroke-width="0.4" opacity="0.4" />
    <circle cx="64" cy="64" r="54" fill="none" stroke="#B8C8E0" stroke-width="0.3" opacity="0.3" />
    <!-- Inner circle -->
    <circle cx="64" cy="64" r="52" fill="url(#plat-bg)" />
    <circle cx="64" cy="64" r="50" fill="none" stroke="#B8C8E0" stroke-width="0.3" opacity="0.25" />
    <!-- Ambient particles -->
    <g filter="url(#particle-glow)" opacity="0.5">
        <circle cx="40" cy="38" r="1" fill="#B8C8E0" />
        <circle cx="88" cy="42" r="0.8" fill="#D4DCE8" />
        <circle cx="78" cy="82" r="1.2" fill="#B8C8E0" />
        <circle cx="44" cy="86" r="0.7" fill="#D4DCE8" />
        <circle cx="50" cy="60" r="0.5" fill="#E0E8F8" />
        <circle cx="82" cy="62" r="0.6" fill="#E0E8F8" />
    </g>
    <!-- Lightning bolt - larger, more dramatic -->
    <g filter="url(#glow-p)" transform="translate(64,55)">
        <path d="M-7,-32 L12,-32 L3,-8 L20,-8 L-12,35 L0,5 L-18,5 Z" fill="url(#plat-bolt)"
            stroke="#7A90B0" stroke-width="0.4" />
        <!-- Electric arcs -->
        <path d="M14,-16 Q20,-12 16,-8" fill="none" stroke="#E0E8F8" stroke-width="0.8"
            opacity="0.7" />
        <path d="M-12,8 Q-18,12 -14,16" fill="none" stroke="#D4DCE8" stroke-width="0.6"
            opacity="0.6" />
        <!-- Bright spark particles -->
        <circle cx="16" cy="-20" r="2.5" fill="#F0F4FF" opacity="0.9" />
        <circle cx="-12" cy="14" r="2" fill="#E0E8F8" opacity="0.8" />
        <circle cx="10" cy="10" r="1.5" fill="#FFFFFF" opacity="0.7" />
        <circle cx="-8" cy="-22" r="1.8" fill="#D4DCE8" opacity="0.6" />
        <circle cx="20" cy="-2" r="1" fill="#FFFFFF" opacity="0.9" />
    </g>
    <!-- Subtle shine -->
    <ellipse cx="50" cy="34" rx="24" ry="14" fill="white" opacity="0.06" />
</svg>