<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="65%" stop-color="#DAA520" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2206" />
      <stop offset="100%" stop-color="#1A1400" />
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8D0" />
      <stop offset="40%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#DAA520" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="ray">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#ring)" />
  <circle cx="64" cy="64" r="52" fill="url(#bg)" />
  <!-- Radiating rays -->
  <g transform="translate(64,64)" filter="url(#ray)" opacity="0.2">
    <line x1="0" y1="-40" x2="0" y2="-48" stroke="#FFD700" stroke-width="1.5" />
    <line x1="26" y1="-30" x2="32" y2="-38" stroke="#FFD700" stroke-width="1.2" />
    <line x1="-26" y1="-30" x2="-32" y2="-38" stroke="#FFD700" stroke-width="1.2" />
    <line x1="36" y1="0" x2="44" y2="0" stroke="#FFD700" stroke-width="1" />
    <line x1="-36" y1="0" x2="-44" y2="0" stroke="#FFD700" stroke-width="1" />
  </g>
  <g filter="url(#glow)" transform="translate(64,64)">
    <!-- Main vertical line -->
    <line x1="0" y1="-28" x2="0" y2="28" stroke="url(#icon)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Branch line -->
    <path d="M0,-28 C-20,-16 -20,0 0,8" fill="none" stroke="url(#icon)" stroke-width="3" stroke-linecap="round" />
    <!-- Top circle -->
    <circle cx="0" cy="-28" r="5.5" fill="#1A1400" stroke="url(#icon)" stroke-width="2.5" />
    <!-- Branch dot -->
    <circle cx="-20" cy="-8" r="5" fill="url(#icon)" />
    <!-- Bottom circle -->
    <circle cx="0" cy="28" r="5.5" fill="#1A1400" stroke="url(#icon)" stroke-width="2.5" />
    <path d="M-2.5,26 L0,31 L2.5,26" fill="none" stroke="url(#icon)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sparks -->
    <circle cx="14" cy="-22" r="2" fill="#FFE880" opacity="0.9" />
    <circle cx="-14" cy="14" r="1.5" fill="#FFD700" opacity="0.7" />
    <circle cx="10" cy="12" r="1" fill="#FFF8D0" opacity="0.8" />
    <circle cx="-8" cy="-24" r="1.2" fill="#FFE066" opacity="0.6" />
  </g>
  <ellipse cx="48" cy="34" rx="22" ry="14" fill="white" opacity="0.07" />
</svg>