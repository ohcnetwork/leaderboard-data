<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
        <linearGradient id="gold-ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFE066" />
            <stop offset="35%" stop-color="#FFD700" />
            <stop offset="65%" stop-color="#DAA520" />
            <stop offset="100%" stop-color="#B8860B" />
        </linearGradient>
        <linearGradient id="gold-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2E2206" />
            <stop offset="100%" stop-color="#1A1400" />
        </linearGradient>
        <linearGradient id="gold-bolt" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFF0A0" />
            <stop offset="40%" stop-color="#FFD700" />
            <stop offset="100%" stop-color="#DAA520" />
        </linearGradient>
        <filter id="glow-g">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="ray-glow">
            <feGaussianBlur stdDeviation="2" />
        </filter>
    </defs>
    <!-- Outer ring -->
    <circle cx="64" cy="64" r="60" fill="url(#gold-ring)" />
    <circle cx="64" cy="64" r="57" fill="none" stroke="#FFE066" stroke-width="0.5" opacity="0.5" />
    <!-- Inner circle -->
    <circle cx="64" cy="64" r="52" fill="url(#gold-bg)" />
    <circle cx="64" cy="64" r="50" fill="none" stroke="#FFD700" stroke-width="0.4" opacity="0.35" />
    <!-- Radiating rays behind bolt -->
    <g transform="translate(64,56)" filter="url(#ray-glow)" opacity="0.25">
        <line x1="0" y1="-20" x2="0" y2="-34" stroke="#FFD700" stroke-width="1.5" />
        <line x1="14" y1="-14" x2="22" y2="-24" stroke="#FFD700" stroke-width="1.2" />
        <line x1="-14" y1="-14" x2="-22" y2="-24" stroke="#FFD700" stroke-width="1.2" />
        <line x1="18" y1="0" x2="30" y2="-4" stroke="#FFD700" stroke-width="1" />
        <line x1="-18" y1="0" x2="-30" y2="-4" stroke="#FFD700" stroke-width="1" />
    </g>
    <!-- Lightning bolt -->
    <g filter="url(#glow-g)" transform="translate(64,56)">
        <path d="M-6,-30 L10,-30 L2,-7 L18,-7 L-10,32 L0,4 L-16,4 Z" fill="url(#gold-bolt)"
            stroke="#B8860B" stroke-width="0.5" />
        <!-- Spark particles -->
        <circle cx="14" cy="-18" r="2" fill="#FFE066" opacity="0.9" />
        <circle cx="-10" cy="12" r="1.5" fill="#FFD700" opacity="0.7" />
        <circle cx="8" cy="8" r="1" fill="#FFF0A0" opacity="0.8" />
        <circle cx="-6" cy="-20" r="1.2" fill="#FFE066" opacity="0.6" />
    </g>
    <!-- Subtle shine -->
    <ellipse cx="48" cy="34" rx="22" ry="14" fill="white" opacity="0.08" />
</svg>