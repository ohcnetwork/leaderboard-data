<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E8E8" />
      <stop offset="40%" stop-color="#C0C0C0" />
      <stop offset="100%" stop-color="#808080" />
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2A3A" />
      <stop offset="100%" stop-color="#12121C" />
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F0F0" />
      <stop offset="50%" stop-color="#C0C0C0" />
      <stop offset="100%" stop-color="#909090" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#ring)" />
  <circle cx="64" cy="64" r="52" fill="url(#bg)" />
  <g filter="url(#glow)" transform="translate(64,64)">
    <!-- Main vertical line -->
    <line x1="0" y1="-28" x2="0" y2="28" stroke="url(#icon)" stroke-width="3" stroke-linecap="round" />
    <!-- Branch line -->
    <path d="M0,-28 C-18,-18 -18,-2 0,6" fill="none" stroke="url(#icon)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Top circle -->
    <circle cx="0" cy="-28" r="5" fill="#12121C" stroke="url(#icon)" stroke-width="2.5" />
    <!-- Branch circle -->
    <circle cx="-18" cy="-10" r="4.5" fill="url(#icon)" />
    <!-- Bottom circle -->
    <circle cx="0" cy="28" r="5" fill="#12121C" stroke="url(#icon)" stroke-width="2.5" />
    <path d="M-2,26 L0,30 L2,26" fill="none" stroke="url(#icon)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sparkle -->
    <circle cx="12" cy="-20" r="1.5" fill="#E8E8E8" opacity="0.7" />
    <circle cx="-10" cy="16" r="1" fill="#D0D0D0" opacity="0.5" />
  </g>
  <ellipse cx="48" cy="36" rx="22" ry="14" fill="white" opacity="0.08" />
</svg>