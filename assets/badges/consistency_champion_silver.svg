<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
        <linearGradient id="cs-ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#E8E8E8" />
            <stop offset="40%" stop-color="#C0C0C0" />
            <stop offset="70%" stop-color="#A8A8A8" />
            <stop offset="100%" stop-color="#808080" />
        </linearGradient>
        <linearGradient id="cs-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2A2A3A" />
            <stop offset="100%" stop-color="#12121C" />
        </linearGradient>
        <linearGradient id="cs-flame-outer" x1="0.5" y1="1" x2="0.5" y2="0">
            <stop offset="0%" stop-color="#707080" />
            <stop offset="30%" stop-color="#A0A0B0" />
            <stop offset="60%" stop-color="#C8C8D8" />
            <stop offset="100%" stop-color="#E8E8F0" />
        </linearGradient>
        <linearGradient id="cs-flame-inner" x1="0.5" y1="1" x2="0.5" y2="0">
            <stop offset="0%" stop-color="#A0A0B0" />
            <stop offset="50%" stop-color="#D0D0E0" />
            <stop offset="100%" stop-color="#F0F0FF" />
        </linearGradient>
        <linearGradient id="cs-flame-side" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#808090" />
            <stop offset="100%" stop-color="#B8B8C8" />
        </linearGradient>
        <filter id="flame-glow-s">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <!-- Outer ring -->
    <circle cx="64" cy="64" r="60" fill="url(#cs-ring)" />
    <circle cx="64" cy="64" r="57" fill="none" stroke="#E0E0E0" stroke-width="0.5" opacity="0.4" />
    <!-- Inner circle -->
    <circle cx="64" cy="64" r="52" fill="url(#cs-bg)" />
    <!-- Medium flame - 14 day streak  -->
    <g filter="url(#flame-glow-s)" transform="translate(64,60)">
        <!-- Side wisps -->
        <path d="M-12,-10 C-18,-18 -20,-8 -14,2 C-10,8 -12,4 -12,-10 Z"
            fill="url(#cs-flame-side)" opacity="0.5" />
        <path d="M12,-10 C18,-18 20,-8 14,2 C10,8 12,4 12,-10 Z"
            fill="url(#cs-flame-side)" opacity="0.5" />
        <!-- Main outer flame -->
        <path
            d="M0,-34 C10,-24 20,-12 20,2 C20,16 12,26 0,26 C-12,26 -20,16 -20,2 C-20,-12 -10,-24 0,-34 Z"
            fill="url(#cs-flame-outer)" opacity="0.9" />
        <!-- Inner flame -->
        <path
            d="M0,-22 C6,-14 12,-6 12,4 C12,14 6,18 0,18 C-6,18 -12,14 -12,4 C-12,-6 -6,-14 0,-22 Z"
            fill="url(#cs-flame-inner)" opacity="0.8" />
        <!-- Core -->
        <ellipse cx="0" cy="8" rx="4" ry="8" fill="#F0F0FF" opacity="0.5" />
        <!-- Sparkle at tip -->
        <circle cx="0" cy="-30" r="1.5" fill="white" opacity="0.6" />
    </g>
    <ellipse cx="48" cy="36" rx="22" ry="14" fill="white" opacity="0.08" />
</svg>