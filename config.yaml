org:
  name: Open Healthcare Network
  description: Open Healthcare Network(OHC) is an open-source platform that helps governments, hospitals, and innovators build connected healthcare systems faster, safer, and at national scale.
  url: https://ohc.network
  logo_url: https://raw.githubusercontent.com/ohcnetwork/branding/refs/heads/main/OHC/SVG/Open_Healthcrae_Network-color-logo-icon.svg
  start_date: "2020-03-05"
  socials:
    github: https://github.com/ohcnetwork
    linkedin: https://in.linkedin.com/company/ohcnetwork
    slack: https://rebuildearth.slack.com/
    youtube: https://www.youtube.com/c/CoronaSafeNetwork

meta:
  title: Open Healthcare Network Leaderboard
  description: Open Healthcare Network's contributor leaderboard
  image_url: https://avatars.githubusercontent.com/u/62014451?v=4
  site_url: https://contributors.ohc.network
  favicon_url: https://raw.githubusercontent.com/ohcnetwork/landing/refs/heads/main/src/app/favicon.ico

leaderboard:
  data_source: https://github.com/ohcnetwork/leaderboard-data
  data_update_frequency: 0 */12 * * *
  data_explorer:
    source: ${{ env.LEADERBOARD_DATA_DB_URL }}

  leaderboard:
    all_contributors:
      activity_definitions:
        - pr_opened
        - pr_merged
        - pr_reviewed
        - commited
        - commented
        - issue_opened

  roles:
    core:
      name: Core
      description: The architects and stewards who anchor our mission; designing, shipping, and scaling Open Healthcare Network.

    emeritus:
      name: Emeritus
      description: Honored leaders whose vision and craft helped shape Open Healthcare Network; their legacy continues to guide how we build in public.

    intern:
      name: Intern
      description: Rising builders turning curiosity into impact; shipping production systems, learning fast, and helping Open Healthcare Network reach further.

    alumni:
      name: Alumni
      description: Celebrated teammates who moved on but left an indelible mark; their contributions still ripple through the community and code.

    contributor:
      name: Contributor
      description: Open collaborators who code, document, design, and champion the mission; every merge and message makes healthcare more open for everyone.

    bot:
      name: Bot
      description: Bot performing automated chores, maintenance, and other tasks.
      hidden: true

  badges:
    definitions:
      - slug: activity_milestone
        name: "Activity Milestone"
        description: "Awarded for reaching activity count milestones"
        variants:
          bronze:
            description: "10+ activities"
            svg_url: "https://example.com/bronze-activity.svg"
          silver:
            description: "50+ activities"
            svg_url: "https://example.com/silver-activity.svg"
          gold:
            description: "100+ activities"
            svg_url: "https://example.com/gold-activity.svg"
          platinum:
            description: "500+ activities"
            svg_url: "https://example.com/platinum-activity.svg"

      - slug: points_milestone
        name: "Points Milestone"
        description: "Awarded for reaching points milestones"
        variants:
          bronze:
            description: "100+ points"
            svg_url: "https://example.com/bronze-points.svg"
          silver:
            description: "500+ points"
            svg_url: "https://example.com/silver-points.svg"
          gold:
            description: "1,000+ points"
            svg_url: "https://example.com/gold-points.svg"

      - slug: consistency_champion
        name: "Consistency Champion"
        description: "Awarded for maintaining activity streaks"
        variants:
          bronze:
            description: "7 day streak"
            svg_url: "https://example.com/bronze-streak.svg"
          silver:
            description: "14 day streak"
            svg_url: "https://example.com/silver-streak.svg"
          gold:
            description: "30 day streak"
            svg_url: "https://example.com/gold-streak.svg"

    rules:
      - type: threshold
        badge_slug: activity_milestone
        enabled: true
        aggregate_slug: activity_count
        thresholds:
          - variant: bronze
            value: 10
          - variant: silver
            value: 50
          - variant: gold
            value: 100
          - variant: platinum
            value: 500

      - type: threshold
        badge_slug: points_milestone
        enabled: true
        aggregate_slug: total_activity_points
        thresholds:
          - variant: bronze
            value: 100
          - variant: silver
            value: 500
          - variant: gold
            value: 1000

      - type: streak
        badge_slug: consistency_champion
        enabled: true
        streak_type: daily
        thresholds:
          - variant: bronze
            days: 7
          - variant: silver
            days: 14
          - variant: gold
            days: 30

  # Example plugin configurations (uncomment and configure as needed):
  plugins:
    github:
      name: GitHub Plugin
      source: "file://${{ env.LEADERBOARD_DATA_DIR }}/plugins/github.js"
      config:
        githubOrg: ${{ env.GITHUB_ORG }}
        # githubToken: ${{ env.GITHUB_TOKEN }}
        githubTokens:
          - ${{ env.GITHUB_TOKEN_1 }}
          - ${{ env.GITHUB_TOKEN_2 }}
          - ${{ env.GITHUB_TOKEN_3 }}
          - ${{ env.GITHUB_TOKEN_4 }}
          - ${{ env.GITHUB_TOKEN_6 }}
          - ${{ env.GITHUB_TOKEN_7 }}
          - ${{ env.GITHUB_TOKEN_8 }}
        defaultRole: contributor
        blacklist:
          - invalid-email-address

    # slack:
    #   name: Slack Plugin
    #   source: "file://${{ env.LEADERBOARD_DATA_DIR }}/plugins/slack.js"
    #   config:
    #     slackApiToken: ${{ env.SLACK_API_TOKEN }}
    #     slackChannel: ${{ env.SLACK_CHANNEL }}
  #
  # Optional: Specify aggregates to display
  # aggregates:
  #   global:
  #     - total_activities
  #     - total_contributors
  #   contributor:
  #     - total_activity_points
  #     - activity_count
  #
  # Optional: Specify top contributors sidebar activities
  top_contributors:
    - pr_merged
    - pr_opened
    - issue_opened

  social_profiles:
    github:
      icon: github
    linkedin:
      icon: linkedin
    slack:
      icon: slack
