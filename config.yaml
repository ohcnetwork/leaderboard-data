org:
  name: Open Healthcare Network
  description: Open Healthcare Network(OHC) is an open-source platform that helps governments, hospitals, and innovators build connected healthcare systems faster, safer, and at national scale.
  url: https://ohc.network
  logo_url: https://raw.githubusercontent.com/ohcnetwork/branding/refs/heads/main/OHC/SVG/Open_Healthcrae_Network-color-logo-icon.svg
  start_date: "2020-03-05"
  socials:
    github: https://github.com/ohcnetwork
    linkedin: https://in.linkedin.com/company/ohcnetwork
    slack: https://rebuildearth.slack.com/
    youtube: https://www.youtube.com/c/CoronaSafeNetwork

meta:
  title: Open Healthcare Network Leaderboard
  description: Open Healthcare Network's contributor leaderboard
  image_url: https://avatars.githubusercontent.com/u/62014451?v=4
  site_url: https://contributors.ohc.network
  favicon_url: https://raw.githubusercontent.com/ohcnetwork/landing/refs/heads/main/src/app/favicon.ico

leaderboard:
  data_source: https://github.com/ohcnetwork/leaderboard-data
  data_update_frequency: 0 */12 * * *
  data_explorer:
    source: https://ohcnetwork.github.io/leaderboard-data/data.db

  roles:
    core:
      name: Core
      description: Core team member of Open Healthcare Network

    emeritus:
      name: Emeritus
      description: Emeritus Member of Open Healthcare Network

    intern:
      name: Intern
      description: Intern at Open Healthcare Network

    alumni:
      name: Alumni
      description: Former team members who have made significant contributions to Open Healthcare Network.

    contributor:
      name: Contributor
      description: Contributed to project(s) of Open Healthcare Network

    bot:
      name: Bot
      description: Bot performing automated chores, maintenance, and other tasks.
      hidden: true

  # Example plugin configurations (uncomment and configure as needed):
  plugins:
    github:
      name: GitHub Plugin
      source: "file://${{ env.LEADERBOARD_DATA_DIR }}/plugins/github.js"
      config:
        githubOrg: ${{ env.GITHUB_ORG }}
        githubToken: ${{ env.GITHUB_TOKEN }}
        # githubTokens:
        #   - ${{ env.GITHUB_TOKEN_1 }}
        #   - ${{ env.GITHUB_TOKEN_2 }}
        #   - ${{ env.GITHUB_TOKEN_3 }}
        #   - ${{ env.GITHUB_TOKEN_4 }}
        #   - ${{ env.GITHUB_TOKEN_5 }}
        defaultRole: contributor

    # slack:
    #   name: Slack Plugin
    #   source: "file://${{ env.LEADERBOARD_DATA_DIR }}/plugins/slack.js"
    #   config:
    #     slackApiToken: ${{ env.SLACK_API_TOKEN }}
    #     slackChannel: ${{ env.SLACK_CHANNEL }}
  #
  # Optional: Specify aggregates to display
  # aggregates:
  #   global:
  #     - total_activities
  #     - total_contributors
  #   contributor:
  #     - total_activity_points
  #     - activity_count
  #
  # Optional: Specify top contributors sidebar activities
  top_contributors:
    - pr_merged
    - pr_opened
    - issue_opened

  social_profiles:
    github:
      icon: github
    linkedin:
      icon: linkedin
    slack:
      icon: slack
